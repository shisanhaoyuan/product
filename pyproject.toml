[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "independent-product-library"
version = "0.1.0"
description = "Independent local product catalog with provenance and integration adapters"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.162,<1", "starlette>=1.3.1,<2", "uvicorn>=0.30,<1", "pydantic>=2.10,<3", "httpx>=0.27,<1", "Pillow>=11,<13", "psycopg[binary]>=3.2,<4"]

[project.optional-dependencies]
oss = ["alibabacloud-oss-v2>=1.4,<2"]
test = ["pytest>=8", "httpx>=0.27"]

[tool.setuptools.packages.find]
include = ["catalog*"]

[tool.setuptools.package-data]
catalog = ["*.sql"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = ["storage_integration: explicit backend and migration tests"]
