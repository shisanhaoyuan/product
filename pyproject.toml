[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "independent-product-library"
version = "0.1.0"
description = "Independent local product catalog with provenance and integration adapters"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.162,<1", "starlette>=1.3.1,<2", "uvicorn>=0.30,<1", "pydantic>=2.10,<3"]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27"]

[tool.setuptools.packages.find]
include = ["catalog*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
