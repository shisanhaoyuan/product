# Inside the BaoTa site's HTTPS server block, not a separate server block.
# Remove conflicting location / and static-cache locations from that site.
client_max_body_size 21m;
location / {
    proxy_pass http://127.0.0.1:8765;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Overwrite client-provided forwarded addresses for login throttling.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_connect_timeout 5s;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
    proxy_cache off;
}
